[project]
name = "xldiff"
version = "0.1.0"
description = "Excel (.xlsx) の差分を git diff 風に表示する CLI ツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
xldiff = "xldiff.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xldiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
